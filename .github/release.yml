on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: ./scripts/build.sh
      - run: |
          git config user.name "ekko-github[bot]"
          git config user.email "285673000+ekko-github[bot]@users.noreply.github.com"
          git add main-* invoke-binary.js
          git commit -m "build: binaries for ${GITHUB_REF_NAME}"
          git tag -f "${GITHUB_REF_NAME}"
          git push origin "${GITHUB_REF_NAME}" --force