name: 'Ekko Gitops Action'
description: 'A specialized gitops action to build images and update manifests in @jaka-k/ekko'
author: 'Jaka Krajnc <444.ous@gmail.com>'
inputs:
  ekkoRepository:
    required: false
    description: 'FluxCD repository'
    default: 'https://github.com/jaka-k/ekko'
  ghToken:
    required: true
    description: 'GitHub Token with write access to the ekko repository'
  ghcrToken:
    required: false
    description: 'GitHub Package Registry Token for Authorization'
    default: ${{ secrets.token }}
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache-dependency-path: ${{ github.action_path }}/go.sum

    - run: go run ./cmd generate-tags
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        INPUT_GHTOKEN: ${{ inputs.ghToken }}
        INPUT_GHCRTOKEN: ${{ inputs.ghcrToken }}
        INPUT_EKKOREPOSITORY: ${{ inputs.ekkoRepository }}